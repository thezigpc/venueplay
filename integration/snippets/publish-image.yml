# .github/workflows/publish-image.yml
# Builds the game's image and pushes it to GitHub Container Registry (GHCR) whenever
# bargames.json changes on main. The image name and tag come from bargames.json:
#   "version": "0.2.0",
#   "image":   "ghcr.io/<owner>/<name>:0.2.0"
# Versions are immutable: an already-published tag is skipped, never overwritten.
# First publish only:
#   - a brand-new repo's first push does not trigger the paths filter, so start the
#     first run by hand: Actions tab > Publish image > Run workflow (or
#     `gh workflow run publish-image.yml`);
#   - make the package Public in its GitHub settings (see the guide, step 10).

name: Publish image

on:
  push:
    branches: [main]
    paths: [bargames.json]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read image and version from bargames.json
        id: manifest
        run: |
          image=$(jq -r .image bargames.json)
          version=$(jq -r .version bargames.json)
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          case "$image" in
            "ghcr.io/$owner/"*":$version") ;;
            *)
              echo "::error file=bargames.json::image must be ghcr.io/$owner/<name>:$version (found: $image)"
              exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.manifest.outputs.image }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.manifest.outputs.image }} already exists. Bump version (and the image tag) in bargames.json to publish a new one."
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.manifest.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.manifest.outputs.version }}
