<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Broker image: the broker runs as "node" and drives Bluetooth speakers through BlueZ
     (bluetoothctl) and BlueALSA (aplay -D bluealsa:...). Both daemons run as root inside
     the broker container, on the container's own system bus (not the host's). -->
<busconfig>
  <policy user="node">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluealsa"/>
  </policy>
</busconfig>
