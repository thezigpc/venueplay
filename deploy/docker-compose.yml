# Bar Games box. Two ways to run it:
#   - Released images (boxes): set BARGAMES_VERSION in .env (e.g. 0.9.0), then
#       docker compose pull && docker compose up -d      (or: bgctl self-update)
#   - From source (development): leave BARGAMES_VERSION unset, then docker compose up -d --build
# Games are NOT listed here: core creates them on demand (bg-game-<id>) through the
# socket proxy, each on its own network.
name: bargames

services:
  core:
    build: { context: .., dockerfile: deploy/Dockerfile, target: app, args: { BOX_VERSION: "${BARGAMES_VERSION:-dev}" } }
    image: ghcr.io/thezigpc/bargames:${BARGAMES_VERSION:-dev}
    container_name: bargames-core
    restart: unless-stopped
    command: ["node", "apps/core/dist/index.js"]
    environment:
      PORT: "7100"
      DATA_DIR: /data
      CORE_INTERNAL_URL: http://bargames-core:7100
      GAME_RUNTIME: docker
      DOCKER_URL: http://docker-proxy:2375
      ATTACH_CONTAINERS: bargames-core,bargames-gateway
      BROKER_URL: http://host.docker.internal:7200
      BROKER_TOKEN: ${BROKER_TOKEN:?set BROKER_TOKEN in .env}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_DIST: /app/apps/admin/dist
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Loopback only (never the LAN): integrations on the host network (Matter) reach core here.
    # Every /internal route still needs its own token; /api needs the admin login.
    ports: ["127.0.0.1:7100:7100"]
    volumes: ["./data/core:/data"]
    networks: [bargames, docker-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  gateway:
    image: ghcr.io/thezigpc/bargames:${BARGAMES_VERSION:-dev}
    container_name: bargames-gateway
    restart: unless-stopped
    command: ["node", "apps/gateway/dist/index.js"]
    environment:
      PORT: "7080"
      CORE_URL: http://bargames-core:7100
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # LAN, out of the box: http://<box IP>/ opens the admin console (first-run setup,
      # then login). 7080 stays for the broker's Chromium and development.
      - "80:7080"
      - "7080:7080"
    networks: [bargames]
    depends_on:
      core: { condition: service_healthy }
    # Healthy once it has its routes from core. bgctl self-update waits for this.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7080/__bargames/gateway-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s

  broker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: broker, args: { BOX_VERSION: "${BARGAMES_VERSION:-dev}" } }
    image: ghcr.io/thezigpc/bargames-broker:${BARGAMES_VERSION:-dev}
    container_name: bargames-broker
    restart: unless-stopped
    # Starts as root only to run seatd for plugged-in screens; the broker runs as node.
    user: "0:0"
    entrypoint: ["/usr/local/bin/broker-start"]
    command: ["node", "apps/broker/dist/index.js"]
    # Host network: SSDP/mDNS discovery and AirPlay connections from the TVs.
    network_mode: host
    # Box 0.16.1: a box with an Nvidia GPU (driver + nvidia-container-toolkit on the host)
    # sets BROKER_RUNTIME=nvidia in .env, and 4K TVs get real 4K (HEVC on NVENC).
    runtime: ${BROKER_RUNTIME:-runc}
    environment:
      PORT: "7200"
      # Only core calls the broker's API: it reaches it at host.docker.internal (docker0).
      # Not the venue LAN. (A name that can't be resolved falls back to 0.0.0.0.)
      HOST: ${BROKER_HOST:-127.0.0.1,docker0}
      DATA_DIR: /data
      BROKER_TOKEN: ${BROKER_TOKEN}
      # local = screens plugged into the box (HDMI/DisplayPort).
      DRIVERS: ${DRIVERS:-roku,airplay,vizio,appletv,local}
      MOCK_DISPLAYS: ${MOCK_DISPLAYS:-0}
      # AirPlay casting: auto picks the QuickSync encoder; vaapi forces it.
      AIRPLAY_HWACCEL: ${AIRPLAY_HWACCEL:-auto}
      # 4K TVs: auto = HEVC on the Nvidia GPU when the broker has one (BROKER_RUNTIME=nvidia).
      AIRPLAY_HEVC: ${AIRPLAY_HEVC:-auto}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-video,compute,utility}
      CAST_FPS: ${CAST_FPS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Sound (Settings > Connected devices): the box's jack/HDMI through /dev/snd (bound with a
    # device rule, so a box without sound hardware still starts), Bluetooth pairings kept in
    # data/bluetooth. NET_ADMIN is for bluetoothd (root, in this container); the broker
    # process itself still drops every capability (broker-start).
    volumes: ["./data/broker:/data", "./data/bluetooth:/var/lib/bluetooth", "/dev/snd:/dev/snd"]
    devices: ["/dev/dri:/dev/dri"]
    device_cgroup_rules: ["c 116:* rmw"]
    cap_add: [NET_ADMIN]
    group_add: ["${RENDER_GID:-991}", "${VIDEO_GID:-44}", "${AUDIO_GID:-29}"]
    shm_size: 2gb
    # bgctl self-update waits for this, so a release whose broker won't start is rolled back.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s

  docker-proxy:
    # Only the Docker API calls core needs. Core never sees the raw socket.
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: bargames-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [docker-api]

  # Cloudflare Tunnel: no service here. The admin UI's Internet tab creates the tunnel
  # and core runs cloudflared as "bargames-tunnel" on the bargames network (see
  # docs/CLOUDFLARE.md). Don't also run a cloudflared of your own with that name.

networks:
  bargames:
    name: bargames
  docker-api:
    name: bargames-docker-api
    internal: true
